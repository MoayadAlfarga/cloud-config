build:
  version: "3.0"
url:
  loans:
#    service: http://localhost:8091/loan-service/api/loans
    service: http://loans-ms:8091/loan-service/api/loans
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    url: jdbc:mysql://localhost:3306/accounts
    password: MySql20
  application:
    name: accounts
  liquibase:
    enabled: 'true'
    change-log: classpath:db.changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: none
accounts:
  message: "Welcome To account Service  API Local Profile  Default"
  contactDetails:
    name: "Moayad Faraj -  Java Developer"
    email: "john@eazybank.com"
  onCallSupport:
    - (555) 555-1234
    - (555) 523-1345
eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8012/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
info:
  app:
    name: "loans"
    description: "Eazy Bank loans Application"
    version: "1.0.0"